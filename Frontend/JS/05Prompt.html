<!doctype html>
<html>

<head>
    <title>Prompt</title>
</head>

<body>

    <p id="result"></p>


    <script>
        a = prompt("Enter first number");
        b = prompt("Enter second number");
        c = prompt("Enter third number");
        x = parseInt(a);
        y = parseInt(b);
        z = parseInt(c);

        document.getElementById("result").innerHTML = x + ' + ' + y + ' + ' + z + ' = ' + (x + y + z);

    </script>

</body>


</html>
